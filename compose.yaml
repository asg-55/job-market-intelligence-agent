services:
  copilot:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    command: ["job-copilot", "watch", "--interval", "43200"]
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      disable: true

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]

  lint:
    build:
      context: .
      target: lint
    profiles: ["test"]

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
