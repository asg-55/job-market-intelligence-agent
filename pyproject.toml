[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-market-intelligence-agent"
version = "0.1.0"
description = "Explainable job-market monitoring and vacancy matching with Telegram delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff==0.16.0",
]

[project.scripts]
job-copilot = "job_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
